<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scheme B · Floating Inset</title>
  <link rel="stylesheet" href="./shared.css" />
  <style>
    body { background: #eef2f7; }
    .shell {
      padding: 12px;
      gap: 12px;
      background: #eef2f7;
    }
    .sidebar {
      width: 252px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.18);
      overflow: hidden;
    }
    .brand {
      padding: 18px 18px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
    }
    .brand strong { font-size: 14px; display: block; }
    .brand small { font-size: 11px; color: #94a3b8; }
    .nav { flex: 1; padding: 8px 12px 16px; overflow: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 12px; border-radius: 10px;
      width: 100%; text-align: left; font-size: 13.5px; color: #94a3b8;
      margin-bottom: 4px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-item.active {
      background: linear-gradient(90deg, rgba(99,102,241,0.35), rgba(56,189,248,0.15));
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(148,163,184,0.25);
    }
    .nav-group { margin-top: 14px; margin-bottom: 6px; padding: 0 12px; font-size: 11px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
    .page {
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }
    .topbar { border-bottom-color: #f1f5f9; }
    .main { background: #fafbfc; }
    .hero-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      color: #fff;
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .hero-card h1 { margin: 0; font-size: 22px; }
    .hero-card p { margin: 8px 0 0; color: #94a3b8; font-size: 13px; max-width: 40ch; }
    .user-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px 6px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="proto-bar">
    <a href="./index.html">← 方案对照</a>
    <strong>B · Floating Inset</strong>
    <span class="tag">体验优先</span>
    <div class="spacer"></div>
    <span>范式：shadcn floating sidebar · 圆角悬浮壳</span>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <strong>Cloud Console</strong>
          <small>workspace · prod</small>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
          概览
        </button>
        <button class="nav-item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
          用量
        </button>
        <div class="nav-group">产品</div>
        <button class="nav-item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
          因子看板
        </button>
        <button class="nav-item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          API Key
        </button>
        <button class="nav-item">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 22l-6-4-6 4 1.5-8.5L2 9h7z"/></svg>
          套餐
        </button>
        <div class="nav-group">账户</div>
        <button class="nav-item">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          设置
        </button>
      </nav>
    </aside>

    <div class="page">
      <header class="topbar">
        <div class="search" style="min-width:260px">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          搜索资源…
          <kbd>⌘K</kbd>
        </div>
        <div class="grow"></div>
        <button class="btn">文档</button>
        <div class="user-chip">
          <div class="avatar" style="width:26px;height:26px;font-size:11px">云</div>
          宽舟科技
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </header>
      <main class="main">
        <div class="hero-card">
          <div>
            <div class="crumbs" style="color:#64748b;margin-bottom:10px">
              <span>控制台</span><span class="sep">/</span><span style="color:#e2e8f0">概览</span>
            </div>
            <h1>早上好，开发者</h1>
            <p>悬浮侧栏 + 内容卡片化。营销站与控制台同仓时视觉更统一，壳仍通过 modules 动态挂菜单。</p>
          </div>
          <button class="btn primary" style="background:#fff;color:#0f172a;border:none">查看用量</button>
        </div>
        <div class="stats">
          <div class="stat"><div class="label">本月额度</div><div class="value">42%</div><div class="delta">剩余 58%</div></div>
          <div class="stat"><div class="label">API Key</div><div class="value">6</div><div class="delta">2 即将过期</div></div>
          <div class="stat"><div class="label">下载任务</div><div class="value">18</div><div class="delta">3 进行中</div></div>
          <div class="stat"><div class="label">套餐</div><div class="value">Pro</div><div class="delta">续费 24 天</div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><span>快捷入口</span></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px">
            <div class="stat" style="margin:0;cursor:pointer"><div class="label">因子看板</div><div class="value" style="font-size:16px">打开 →</div></div>
            <div class="stat" style="margin:0;cursor:pointer"><div class="label">创建 API Key</div><div class="value" style="font-size:16px">新建 →</div></div>
            <div class="stat" style="margin:0;cursor:pointer"><div class="label">升级套餐</div><div class="value" style="font-size:16px">对比 →</div></div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
