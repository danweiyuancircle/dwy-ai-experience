<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scheme D · Top Primary + Side</title>
  <link rel="stylesheet" href="./shared.css" />
  <style>
    .shell { flex-direction: column; }
    .app-header {
      height: 52px;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .app-header .logo {
      display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px;
    }
    .app-header .logo-mark {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, #22d3ee, #6366f1);
    }
    .top-nav { display: flex; gap: 4px; }
    .top-nav button {
      height: 32px; padding: 0 12px; border-radius: 8px;
      font-size: 13px; color: #94a3b8;
    }
    .top-nav button:hover { color: #fff; background: #1e293b; }
    .top-nav button.active { color: #fff; background: #1e293b; }
    .workspace {
      display: flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 10px; border-radius: 8px;
      background: #1e293b; font-size: 12px; color: #cbd5e1;
      border: 1px solid #334155;
    }
    .body { flex: 1; display: flex; min-height: 0; }
    .side {
      width: 200px;
      background: #fff;
      border-right: 1px solid var(--border);
      padding: 12px 10px;
      flex-shrink: 0;
    }
    .side .label {
      font-size: 11px; color: #94a3b8; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 6px 10px 8px;
    }
    .side .item {
      display: flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 10px; border-radius: 8px;
      width: 100%; text-align: left; font-size: 13px; color: var(--muted);
      margin-bottom: 2px;
    }
    .side .item:hover { background: var(--accent); color: var(--fg); }
    .side .item.active { background: #f1f5f9; color: var(--fg); font-weight: 600; }
    .content-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div class="proto-bar">
    <a href="./index.html">← 方案对照</a>
    <strong>D · Top Primary + Side</strong>
    <span class="tag">多产品</span>
    <div class="spacer"></div>
    <span>范式：企业门户 / 多工作区 · 顶栏一级 + 侧栏二级</span>
  </div>

  <div class="shell">
    <header class="app-header">
      <div class="logo">
        <div class="logo-mark"></div>
        DWY Platform
      </div>
      <nav class="top-nav">
        <button class="active">Cloud</button>
        <button>Admin</button>
        <button>Docs</button>
        <button>Billing</button>
      </nav>
      <div style="flex:1"></div>
      <div class="workspace">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
        宽舟科技 · prod
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="avatar" style="width:28px;height:28px;font-size:11px">云</div>
    </header>

    <div class="body">
      <aside class="side">
        <div class="label">Cloud 功能</div>
        <button class="item active">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          概览
        </button>
        <button class="item">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>
          用量
        </button>
        <button class="item">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          API Key
        </button>
        <button class="item">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 22l-6-4-6 4 1.5-8.5L2 9h7z"/></svg>
          套餐
        </button>
        <button class="item">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          设置
        </button>
      </aside>

      <div class="content-wrap">
        <div class="topbar" style="height:48px">
          <div class="crumbs" style="margin:0">
            <span>Cloud</span><span class="sep">/</span><span style="color:var(--fg)">概览</span>
          </div>
          <div class="grow"></div>
          <div class="search" style="min-width:200px;height:32px">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            搜索…
            <kbd>⌘K</kbd>
          </div>
        </div>
        <main class="main">
          <div class="hero">
            <h1>Cloud 概览</h1>
            <p>顶栏切换产品/应用（Cloud / Admin / Docs），侧栏只展示当前产品下的模块。多仓统一门户时最合适。</p>
          </div>
          <div class="stats">
            <div class="stat"><div class="label">产品</div><div class="value" style="font-size:18px">Cloud</div><div class="delta">当前工作区</div></div>
            <div class="stat"><div class="label">本月调用</div><div class="value">86.2k</div><div class="delta">↑ 8%</div></div>
            <div class="stat"><div class="label">席位</div><div class="value">12</div><div class="delta">3 管理员</div></div>
            <div class="stat"><div class="label">账单</div><div class="value">¥2.4k</div><div class="delta">周期中</div></div>
          </div>
          <div class="panel">
            <div class="panel-head"><span>跨产品入口（示意）</span></div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:16px">
              <div class="stat" style="margin:0"><div class="label">Cloud</div><div class="value" style="font-size:15px">控制台 · 当前</div></div>
              <div class="stat" style="margin:0"><div class="label">Admin</div><div class="value" style="font-size:15px">运维后台 →</div></div>
              <div class="stat" style="margin:0"><div class="label">Docs</div><div class="value" style="font-size:15px">文档门户 →</div></div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
