[project]
name = "dwyeapi"
version = "0.7.1"
description = "Lightweight FastAPI infrastructure — exceptions, database, config, security, cache, pagination, logger"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
tasks = [
    "arq>=0.26.0",
]

# Email Provider 实现 — 按需安装
# resend[async] 会拉入 httpx 以启用 Emails.send_async 原生异步 API
email-resend = ["resend[async]>=2.29.0"]
email-aliyun = ["alibabacloud_dm20151123>=1.0.0"]

# SMS Provider 实现 — 按需安装
sms-aliyun = ["alibabacloud_dysmsapi20170525>=2.0.0"]

# 聚合 extras(按模块)
email = ["resend[async]>=2.29.0", "alibabacloud_dm20151123>=1.0.0"]
sms = ["alibabacloud_dysmsapi20170525>=2.0.0"]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "arq>=0.26.0",
    "fakeredis>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/dwyeapi/tasks/router.py" = ["B008"]
"src/dwyeapi/tasks/worker.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["dwyeapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
