[project]
name = "danweiyuan-eapi"
version = "0.3.0"
description = "Lightweight FastAPI infrastructure — exceptions, database, config, security, cache, pagination"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
tasks = [
    "arq>=0.26.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "arq>=0.26.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/danweiyuan_eapi/tasks/router.py" = ["B008"]
"src/danweiyuan_eapi/tasks/worker.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["danweiyuan_eapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
