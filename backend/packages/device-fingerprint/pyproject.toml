[project]
name = "dwy-device-fingerprint"
version = "0.1.0"
description = "Application-scoped device fingerprints using native OS identity and the Python standard library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.9"]

[project.urls]
Repository = "https://github.com/danweiyuancircle/dwy-ai-experience"

[build-system]
requires = ["setuptools==77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dwy_device = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D107", "D203", "D213", "D401", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.isort]
known-first-party = ["dwy_device"]

[tool.uv]
# 固定依赖选择时间边界, 避免重新解析时引入刚发布的测试工具依赖.
exclude-newer = "2026-10-13T00:00:00Z"
