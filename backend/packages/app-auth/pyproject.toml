[project]
name = "dwy-app-auth"
version = "0.1.0"
description = "Google and email/password user sessions and independent administrator Cookie authentication for EAPI"
requires-python = ">=3.11,<3.13"
dependencies = ["dwyeapi==0.11.1", "SQLAlchemy==2.0.49", "pydantic==2.13.4", "google-auth[requests]==2.62.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwy_app_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "httpx==0.28.1", "aiosqlite==0.22.1", "ruff==0.15.12", "alembic==1.18.4"]
