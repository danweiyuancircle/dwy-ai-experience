[project]
name = "dwy-auth"
version = "0.1.1"
description = "Apple, Google and email/password authentication with application-owned sessions and storage"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["SQLAlchemy[asyncio]==2.0.49", "pydantic==2.13.4", "google-auth[requests]==2.62.0", "anyio>=4.0.0", "bcrypt>=4.0.0", "python-jose[cryptography]>=3.3.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwy_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dwy_auth"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "httpx==0.28.1", "aiosqlite==0.22.1", "ruff==0.15.12", "alembic==1.18.4"]
