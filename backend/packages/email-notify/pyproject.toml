[project]
name = "dwy-email-notify"
version = "0.1.0"
description = "邮件平台官方 Webhook 事件接入与通知转发"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["dwyeapi==0.12.1", "dwy-notify==0.2.1"]

[project.optional-dependencies]
resend = ["resend==2.49.1"]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "httpx==0.28.1", "ruff==0.15.12"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwy_email_notify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dwy_email_notify"]
