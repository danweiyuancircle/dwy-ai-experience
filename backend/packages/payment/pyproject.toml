[project]
name = "dwy-payment"
version = "0.3.0"
description = "可复用支付插件:渠道流水、微信 Native,不绑定具体商品"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "dwyeapi>=0.12.1,<0.13",
    "sqlalchemy[asyncio]==2.0.49",
    "pydantic==2.13.4",
    "wechatpayv3[async]==2.0.4",
    "dwy-wechatpay-notify>=0.1.1,<0.2",
]

[project.optional-dependencies]
alipay = ["alipay-sdk-python==3.7.1397", "pycryptodome==3.24.1"]
migrations = ["alembic==1.18.4"]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "httpx==0.28.1", "aiosqlite==0.22.1", "ruff==0.15.12", "alembic==1.18.4", "asyncpg==0.31.0"]

[project.urls]
Repository = "https://github.com/danweiyuancircle/dwy-ai-experience"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwy_payment"]

[tool.hatch.build.targets.sdist]
include = ["src/dwy_payment", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dwy_payment"]
