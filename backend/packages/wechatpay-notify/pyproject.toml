[project]
name = "dwy-wechatpay-notify"
version = "0.1.0"
description = "微信支付官方回调验证与安全通知事件适配"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["dwy-notify>=0.2.1,<0.4", "pydantic>=2.10,<3", "wechatpayv3[async]==2.0.4"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "httpx==0.28.1", "ruff==0.15.12"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwy_wechatpay_notify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dwy_wechatpay_notify"]
