[project]
name = "dwy-apple-notify"
version = "0.1.1"
description = "Apple 购买、审核、评论与经营报表通知集成"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["dwyeapi==0.12.1", "dwy-notify==0.2.1"]

[project.optional-dependencies]
iap = ["app-store-server-library[async]==3.1.2"]
asc = ["httpx==0.28.1", "PyJWT==2.15.1", "cryptography==50.0.2"]
reviews = ["httpx==0.28.1", "PyJWT==2.15.1", "cryptography==50.0.2"]
analytics = ["httpx==0.28.1", "PyJWT==2.15.1", "cryptography==50.0.2"]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "httpx==0.28.1", "aiosqlite==0.22.1", "ruff==0.15.12"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwy_apple_notify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dwy_apple_notify"]
