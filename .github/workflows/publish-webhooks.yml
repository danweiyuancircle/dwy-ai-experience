name: Publish dwy-webhooks to PyPI

on:
  push:
    tags:
      - 'dwy-webhooks@*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'

      - name: Verify repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/private_release.py check

      - name: Install build dependencies
        run: python -m pip install uv==0.13.0

      - name: Verify tag matches package version
        id: verify
        working-directory: backend/packages/webhooks
        run: |
          PKG_NAME=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["name"])
          PY
          )
          PKG_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )
          TAG_NAME="${GITHUB_REF_NAME%@*}"
          TAG_VERSION="${GITHUB_REF_NAME##*@}"
          if [ "$PKG_NAME" != "$TAG_NAME" ]; then
            echo "::error::tag package ($TAG_NAME) != pyproject name ($PKG_NAME)"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != pyproject version ($PKG_VERSION)"
            exit 1
          fi
          echo "release_name=$PKG_NAME@$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          uv sync --project ci --frozen
          uv run --project ci --frozen pytest -c backend/packages/webhooks/pyproject.toml backend/packages/webhooks/tests -q
          uv run --project ci --frozen ruff check --config backend/packages/webhooks/pyproject.toml backend/packages/webhooks/src backend/packages/webhooks/tests

      - name: Build
        working-directory: backend/packages/webhooks
        run: uv build --out-dir dist --default-index https://pypi.org/simple

      - name: Verify installable distributions
        run: >-
          python scripts/check_python_distribution.py backend/packages/webhooks
          --module dwy_webhooks --extras discord,resend,apple,reviews,analytics
          --import-module dwy_webhooks.reviews.client
          --import-module dwy_webhooks.reviews.runtime
          --import-module dwy_webhooks.apple
          --import-module dwy_webhooks.analytics.client
          --import-module dwy_webhooks.analytics.runtime

      - name: Verify reviews without other platform SDKs
        run: >-
          python scripts/check_python_distribution.py backend/packages/webhooks
          --module dwy_webhooks --extras discord,reviews
          --import-module dwy_webhooks.reviews.client
          --import-module dwy_webhooks.reviews.runtime

      - name: Verify independent Apple wheel
        run: |
          uv venv --python 3.11.17 "$RUNNER_TEMP/apple-wheel"
          WHEEL=$(python -c 'from pathlib import Path; print(next(Path("backend/packages/webhooks/dist").glob("*.whl")).resolve())')
          uv pip install --python "$RUNNER_TEMP/apple-wheel/bin/python" --no-config --no-sources --default-index https://pypi.org/simple "$WHEEL[discord,apple]"
          "$RUNNER_TEMP/apple-wheel/bin/python" backend/packages/webhooks/tests/apple_wheel_smoke.py "${{ steps.verify.outputs.package_version }}"

      - name: Verify independent analytics wheel
        run: |
          uv venv --python 3.11.17 "$RUNNER_TEMP/analytics-wheel"
          WHEEL=$(python -c 'from pathlib import Path; print(next(Path("backend/packages/webhooks/dist").glob("*.whl")).resolve())')
          uv pip install --python "$RUNNER_TEMP/analytics-wheel/bin/python" --no-config --no-sources --default-index https://pypi.org/simple "$WHEEL[discord,analytics]" aiosqlite==0.22.1
          "$RUNNER_TEMP/analytics-wheel/bin/python" backend/packages/webhooks/tests/analytics_wheel_smoke.py "${{ steps.verify.outputs.package_version }}"

      - name: Stage universal wheel only
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          wheels = list(Path("backend/packages/webhooks/dist").glob("*.whl"))
          assert len(wheels) == 1 and wheels[0].name.endswith("-py3-none-any.whl")
          target = Path(os.environ["RUNNER_TEMP"]) / "dwy-webhooks-wheel"
          target.mkdir()
          shutil.copy2(wheels[0], target / wheels[0].name)
          PY

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: ${{ runner.temp }}/dwy-webhooks-wheel/
