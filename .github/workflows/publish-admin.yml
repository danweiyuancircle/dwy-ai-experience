name: Publish Admin to npm

on:
  push:
    tags:
      - '@dwydev/admin-kit@*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare fixed package managers
        run: npm install --global npm@11.6.1 pnpm@10.19.0

      - name: Verify private source
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/private_release.py check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        id: verify
        working-directory: frontend/admin-shell
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${GITHUB_REF_NAME%@*}"
          TAG_VERSION="${GITHUB_REF_NAME##*@}"
          if [ "$PKG_NAME" != "$TAG_NAME" ]; then
            echo "::error::tag package ($TAG_NAME) != package.json name ($PKG_NAME)"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "release_name=$PKG_NAME@$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        working-directory: frontend/admin-shell
        run: |
          python3 ../../.github/scripts/extract_changelog_section.py \
            CHANGELOG.md \
            "${{ steps.verify.outputs.package_version }}" \
            "${{ steps.verify.outputs.release_name }}" \
            > ../../.github/release-body-admin.md

      # peer 依赖 eui 在 monorepo 内，先保证能 resolve 再打 admin-shell
      - name: Test
        run: |
          pnpm --dir frontend/eui build
          pnpm --dir frontend/ekit build
          pnpm --dir frontend/admin-shell test

      - name: Build
        run: pnpm --dir frontend/admin-shell build

      - name: Verify published EUI dependency
        working-directory: frontend/admin-shell
        run: |
          EUI_RANGE=$(node -p "require('./package.json').peerDependencies['@dwydev/eui']")
          npm view "@dwydev/eui@$EUI_RANGE" version --registry=https://registry.npmjs.org/

      - name: Publish
        working-directory: frontend/admin-shell
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.verify.outputs.release_name }}
          draft: false
          body_path: .github/release-body-admin.md
