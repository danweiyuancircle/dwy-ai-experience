name: Swift sync runtime diagnostics

on:
  push:
    branches: [develop]
    paths: ['.github/workflows/sync-runtime-diagnostics.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        binding: ['named-default', 'optional-default', 'injected-only']
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      DIAGNOSTIC_BINDING: ${{ matrix.binding }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Isolate default async callback generation
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('ios/Sources/Shared/SyncCore/SyncCoordinator.swift')
          text = path.read_text()
          binding = os.environ['DIAGNOSTIC_BINDING']
          old = '''sleep: @escaping @Sendable (TimeInterval) async throws -> Void = { seconds in
                      try await Task.sleep(for: .seconds(seconds))
                  }'''
          assert text.count(old) == 1
          if binding == 'named-default':
              text = text.replace(old, 'sleep: @escaping @Sendable (TimeInterval) async throws -> Void = SyncCoordinator.defaultSleep')
              anchor = '    private func isTransient'
              helper = '''    @usableFromInline
              static func defaultSleep(_ seconds: TimeInterval) async throws {
                  try await Task.sleep(for: .seconds(seconds))
              }

          '''
              text = text.replace(anchor, helper + anchor)
          if binding == 'optional-default':
              text = text.replace(old, 'sleep: (@Sendable (TimeInterval) async throws -> Void)? = nil')
              text = text.replace('private let sleep: @Sendable (TimeInterval) async throws -> Void', 'private let sleep: (@Sendable (TimeInterval) async throws -> Void)?')
              text = text.replace('try await sleep(retryDelay)', '''if let sleep {
                                  try await sleep(retryDelay)
                              } else {
                                  try await Task.sleep(for: .seconds(retryDelay))
                              }''')
          path.write_text(text)
          PY
      - name: Reproduce automatic retry runtime failure
        run: |
          if [ "$DIAGNOSTIC_BINDING" = injected-only ]; then
            swift test --filter SyncCoordinatorTests.testAutomaticRetryHonorsAttemptLimitAndServerDelay
          else
            swift test --filter SyncCoordinatorTests.testAutomaticRetryConfirmsLostResponseWithoutNewVersion
          fi
      - name: Verify full Swift suite
        if: matrix.binding != 'injected-only'
        run: swift test
      - name: Verify optimized automatic retry
        if: matrix.binding != 'injected-only'
        run: swift test -c release --filter SyncCoordinatorTests.testAutomaticRetryConfirmsLostResponseWithoutNewVersion
