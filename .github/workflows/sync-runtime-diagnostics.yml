name: Swift sync runtime diagnostics

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/sync-runtime-diagnostics.yml'
      - 'ios/Sources/Shared/SyncCore/**'
      - 'ios/Tests/SyncCoreTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reproduce automatic retry runtime failure
        run: swift test --filter SyncCoordinatorTests.testAutomaticRetryConfirmsLostResponseWithoutNewVersion
      - name: Verify full Swift suite
        run: swift test
      - name: Capture native failure backtrace
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path.home().joinpath('Library/Logs/DiagnosticReports').glob('*AppleAppKit*'):
              text = path.read_text()
              decoder = json.JSONDecoder()
              header, end = decoder.raw_decode(text)
              report = decoder.raw_decode(text[end:].lstrip())[0]
              print(path.name, report.get('exception'), report.get('asi'))
              images = report.get('usedImages', [])
              for thread in report.get('threads', []):
                  if not thread.get('triggered'):
                      continue
                  for frame in thread.get('frames', []):
                      image = images[frame['imageIndex']]
                      print(image.get('name'), frame.get('symbol'), frame.get('symbolLocation'))
          PY
          xcrun lldb --batch -o run -k 'thread backtrace all' -- \
            "$(xcrun --find xctest)" -XCTest \
            SyncCoreTests.SyncCoordinatorTests/testAutomaticRetryConfirmsLostResponseWithoutNewVersion \
            .build/debug/AppleAppKitPackageTests.xctest
