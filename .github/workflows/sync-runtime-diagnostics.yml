name: Swift sync runtime diagnostics

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/sync-runtime-diagnostics.yml'
      - 'ios/Sources/Shared/SyncCore/**'
      - 'ios/Tests/SyncCoreTests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.0.1']
        sleep-binding: ['helper', 'void-task', 'helper-and-void']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Isolate stored async closure access
        env:
          DIAGNOSTIC_BINDING: ${{ matrix.sleep-binding }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('ios/Sources/Shared/SyncCore/SyncCoordinator.swift')
          text = path.read_text()
          binding = os.environ['DIAGNOSTIC_BINDING']
          if 'helper' in binding:
              old = 'try await sleep(retryDelay)'
              assert text.count(old) == 1
              text = text.replace(old, 'try await waitForRetry(retryDelay)')
              anchor = '    private func isTransient'
              helper = '''    @inline(never)
              private func waitForRetry(_ seconds: TimeInterval) async throws {
                  let wait = sleep
                  try await wait(seconds)
              }

          '''
              text = text.replace(anchor, helper + anchor)
          if 'void' in binding:
              old = 'automaticTask = Task { [weak self] in await self?.runAutomatic(epoch: epoch) }'
              assert text.count(old) == 1
              text = text.replace(old, '''automaticTask = Task<Void, Never> { [weak self] in
                      guard let self else { return }
                      await self.runAutomatic(epoch: epoch)
                  }''')
          path.write_text(text)
          PY
      - name: Reproduce automatic retry runtime failure
        run: swift test --filter SyncCoordinatorTests.testAutomaticRetryConfirmsLostResponseWithoutNewVersion
      - name: Verify full Swift suite
        run: swift test
      - name: Verify optimized automatic retry
        run: swift test -c release --filter SyncCoordinatorTests.testAutomaticRetryConfirmsLostResponseWithoutNewVersion
      - name: Capture native failure backtrace
        if: failure()
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path.home().joinpath('Library/Logs/DiagnosticReports').glob('*AppleAppKit*'):
              text = path.read_text()
              decoder = json.JSONDecoder()
              header, end = decoder.raw_decode(text)
              report = decoder.raw_decode(text[end:].lstrip())[0]
              print(path.name, report.get('exception'), report.get('asi'))
              images = report.get('usedImages', [])
              for thread in report.get('threads', []):
                  if not thread.get('triggered'):
                      continue
                  for frame in thread.get('frames', []):
                      image = images[frame['imageIndex']]
                      print(image.get('name'), frame.get('symbol'), frame.get('symbolLocation'))
          PY
          xcrun lldb --batch -o run -k 'thread backtrace all' -- \
            "$(xcrun --find xctest)" -XCTest \
            SyncCoreTests.SyncCoordinatorTests/testAutomaticRetryConfirmsLostResponseWithoutNewVersion \
            .build/debug/AppleAppKitPackageTests.xctest
