name: Publish EUI to npm

on:
  push:
    tags:
      - '@dwydev/eui@*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        id: verify
        working-directory: frontend/eui
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${GITHUB_REF_NAME%@*}"
          TAG_VERSION="${GITHUB_REF_NAME##*@}"
          if [ "$PKG_NAME" != "$TAG_NAME" ]; then
            echo "::error::tag package ($TAG_NAME) != package.json name ($PKG_NAME)"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "release_name=$PKG_NAME@$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm --dir frontend/eui build

      - name: Publish
        working-directory: frontend/eui
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.verify.outputs.release_name }}
          draft: false
          generate_release_notes: true
          body: |
            ## ${{ steps.verify.outputs.release_name }}

            This release is created automatically by GitHub Actions with OIDC.
            本次发布由 GitHub Actions 与 OIDC 自动创建。
