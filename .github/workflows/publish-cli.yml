name: Publish CLI to npm

# 打 create-dwy@x.y.z tag 时发布 create-dwy 到 npm，使用 OIDC Trusted Publishing（免 NPM_TOKEN）
on:
  push:
    tags:
      - 'create-dwy@*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # OIDC Trusted Publishing 必需
    defaults:
      run:
        working-directory: claude-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC Trusted Publishing 需要 npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        id: verify
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#create-dwy@}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "publishing create-dwy@$PKG_VERSION"
          echo "release_name=create-dwy@$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dwy-ai-experience ${{ steps.verify.outputs.release_name }}
          generate_release_notes: true
          body: |
            ## dwy-ai-experience

            This release is created automatically by GitHub Actions with OIDC.
            本次发布由 GitHub Actions 与 OIDC 自动创建。
