name: Publish CLI to npm

# 打 create-dwy@x.y.z tag 时发布 create-dwy 到 npm，使用 OIDC Trusted Publishing（免 NPM_TOKEN）
on:
  push:
    tags:
      - 'create-dwy@*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有 CLI 发布标签，例如 create-dwy@0.21.0'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write   # OIDC Trusted Publishing 必需
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: dwy-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      # OIDC Trusted Publishing 需要 npm >= 11.5.1
      - name: Prepare fixed package managers
        run: npm install --global npm@11.6.1 pnpm@10.19.0

      - name: Verify repository access
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/private_release.py check

      - name: Install dependencies and test
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Verify tag matches package version
        id: verify
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != create-dwy@* ]]; then
            echo "::error::expected a create-dwy@VERSION tag"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#create-dwy@}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "publishing create-dwy@$PKG_VERSION"
          echo "release_name=create-dwy@$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          python3 ../.github/scripts/extract_changelog_section.py \
            CHANGELOG.md \
            "${{ steps.verify.outputs.package_version }}" \
            "${{ steps.verify.outputs.release_name }}" \
            > ../.github/release-body-cli.md

      - name: Publish
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.verify.outputs.release_name }}
          draft: false
          body_path: .github/release-body-cli.md
