name: Publish EAPI to PyPI

on:
  push:
    tags:
      - 'dwyeapi@*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'

      - name: Verify private source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/private_release.py check

      - name: Install build dependencies
        run: python -m pip install uv==0.13.0

      - name: Verify tag matches package version
        id: verify
        working-directory: backend
        run: |
          PKG_NAME=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["name"])
          PY
          )
          PKG_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )
          TAG_NAME="${GITHUB_REF_NAME%@*}"
          TAG_VERSION="${GITHUB_REF_NAME##*@}"
          if [ "$PKG_NAME" != "$TAG_NAME" ]; then
            echo "::error::tag package ($TAG_NAME) != pyproject name ($PKG_NAME)"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != pyproject version ($PKG_VERSION)"
            exit 1
          fi
          echo "release_name=$PKG_NAME@$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        working-directory: backend
        run: |
          python3 ../.github/scripts/extract_changelog_section.py \
            CHANGELOG.md \
            "${{ steps.verify.outputs.package_version }}" \
            "${{ steps.verify.outputs.release_name }}" \
            > ../.github/release-body-eapi.md

      - name: Test
        run: |
          uv sync --project ci --frozen
          uv run --project ci --frozen pytest backend/tests -q -o asyncio_mode=auto

      - name: Build
        working-directory: backend
        run: uv build --out-dir dist --default-index https://pypi.org/simple

      - name: Verify installable distributions
        run: python scripts/check_python_distribution.py backend --module dwyeapi --extras auth,device,email,tasks

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: backend/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.verify.outputs.release_name }}
          draft: false
          body_path: .github/release-body-eapi.md
