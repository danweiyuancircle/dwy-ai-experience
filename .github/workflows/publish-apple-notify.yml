name: Publish dwy-apple-notify to PyPI

on:
  push:
    tags:
      - 'dwy-apple-notify@*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'

      - name: Verify repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/private_release.py check

      - name: Install build dependencies
        run: python -m pip install uv==0.13.0

      - name: Verify tag matches package version
        id: verify
        working-directory: backend/packages/apple-notify
        run: |
          PKG_NAME=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["name"])
          PY
          )
          PKG_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )
          TAG_NAME="${GITHUB_REF_NAME%@*}"
          TAG_VERSION="${GITHUB_REF_NAME##*@}"
          if [ "$PKG_NAME" != "$TAG_NAME" ]; then
            echo "::error::tag package ($TAG_NAME) != pyproject name ($PKG_NAME)"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != pyproject version ($PKG_VERSION)"
            exit 1
          fi
          echo "release_name=$PKG_NAME@$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          uv sync --project ci --frozen
          uv run --project ci --frozen pytest -c backend/packages/apple-notify/pyproject.toml backend/packages/apple-notify/tests -q
          uv run --project ci --frozen ruff check --config backend/packages/apple-notify/pyproject.toml backend/packages/apple-notify/src backend/packages/apple-notify/tests

      - name: Build
        working-directory: backend/packages/apple-notify
        run: uv build --out-dir dist --default-index https://pypi.org/simple

      - name: Verify installable distributions
        run: >-
          python scripts/check_python_distribution.py backend/packages/apple-notify
          --module dwy_apple_notify --extras iap,asc,reviews,analytics

      - name: Verify installed wheel
        run: |
          WHEEL=$(python -c 'from pathlib import Path; print(next(Path("backend/packages/apple-notify/dist").glob("*.whl")).resolve())')
          for pair in base:base iap:apple asc:asc analytics:analytics reviews:base; do
            EXTRA="${pair%%:*}"
            SCRIPT="${pair##*:}"
            ENVIRONMENT="$RUNNER_TEMP/apple-notify-$EXTRA"
            uv venv "$ENVIRONMENT"
            REQUIREMENT="$WHEEL"
            if [ "$EXTRA" != base ]; then REQUIREMENT="${WHEEL}[$EXTRA]"; fi
            uv pip install --python "$ENVIRONMENT/bin/python" --default-index https://pypi.org/simple "$REQUIREMENT"
            if [ "$EXTRA" = analytics ]; then
              uv pip install --python "$ENVIRONMENT/bin/python" --default-index https://pypi.org/simple 'aiosqlite==0.22.1'
            fi
            "$ENVIRONMENT/bin/python" "backend/packages/apple-notify/tests/${SCRIPT}_wheel_smoke.py" "${{ steps.verify.outputs.package_version }}"
            if [ "$EXTRA" = reviews ]; then
              "$ENVIRONMENT/bin/python" -c 'from dwy_apple_notify.reviews import install_review_monitor; assert callable(install_review_monitor)'
            fi
          done

      - name: Stage universal wheel only
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          wheels = list(Path("backend/packages/apple-notify/dist").glob("*.whl"))
          assert len(wheels) == 1 and wheels[0].name.endswith("-py3-none-any.whl")
          target = Path(os.environ["RUNNER_TEMP"]) / "dwy-apple-notify-wheel"
          target.mkdir()
          shutil.copy2(wheels[0], target / wheels[0].name)
          PY

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: ${{ runner.temp }}/dwy-apple-notify-wheel/
