name: Lightweight server monitor

on:
  workflow_dispatch:
  push:
    branches: [develop, master]
    paths:
      - 'backend/tools/**'
      - '.github/workflows/server-monitor.yml'
  pull_request:
    paths:
      - 'backend/tools/**'
      - '.github/workflows/server-monitor.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Install test runner
        run: python -m pip install uv==0.13.0
      - name: Test independent module and real host collection
        run: uv run --no-project --with psutil==7.2.2 --with pytest==9.0.3 python -m pytest backend/tools/tests -q
      - name: Lint
        run: |
          uv run --no-project --with ruff==0.15.12 ruff check --config backend/pyproject.toml backend/tools
          uv run --no-project --with ruff==0.15.12 ruff format --check --config backend/pyproject.toml backend/tools
