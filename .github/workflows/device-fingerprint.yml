name: Device fingerprint contracts

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/packages/device-fingerprint/**'
      - '.github/workflows/device-fingerprint.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 固定各系统实际提供的正式构建, 安全维护分支并非都提供Windows/macOS二进制.
          - {os: ubuntu-24.04, python: '3.9.25', architecture: x64}
          - {os: ubuntu-24.04, python: '3.11.17', architecture: x64}
          - {os: ubuntu-24.04, python: '3.15.0', architecture: x64}
          - {os: windows-2025, python: '3.9.13', architecture: x64}
          - {os: windows-2025, python: '3.11.9', architecture: x64}
          - {os: windows-2025, python: '3.11.9', architecture: x86}
          - {os: windows-2025, python: '3.15.0', architecture: x64}
          - {os: macos-15-intel, python: '3.9.25', architecture: x64}
          - {os: macos-15-intel, python: '3.11.9', architecture: x64}
          - {os: macos-15-intel, python: '3.15.0', architecture: x64}
          - {os: macos-15, python: '3.9.13', architecture: arm64}
          - {os: macos-15, python: '3.11.9', architecture: arm64}
          - {os: macos-15, python: '3.15.0', architecture: arm64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend/packages/device-fingerprint
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Install locked test tools
        run: |
          python -m pip install uv==0.13.0
          uv sync --extra dev --frozen --default-index https://pypi.org/simple
      - name: Unit and real OS acceptance
        env:
          DWY_DEVICE_NATIVE_TEST: '1'
        run: uv run --frozen --extra dev pytest -q
      - name: Lint and build the lightweight package
        run: |
          uv run --frozen --extra dev ruff check src tests
          uv run --frozen --extra dev ruff format --check src tests
          uv build --out-dir dist --default-index https://pypi.org/simple
      - name: Verify isolated zero-dependency wheel import
        run: |
          python -m venv wheel-check
          if [ -x wheel-check/bin/python ]; then
            wheel_python=wheel-check/bin/python
          else
            wheel_python=wheel-check/Scripts/python.exe
          fi
          uv pip install --python "$wheel_python" --no-deps dist/*.whl
          "$wheel_python" -I -c "from dwy_device import collect_device; from importlib.metadata import requires; assert all('extra ==' in entry for entry in (requires('dwy-device-fingerprint') or [])); info = collect_device('dwy.wheel.test'); assert info.status.value == 'available'; print(info.status.value, info.source.value)"
