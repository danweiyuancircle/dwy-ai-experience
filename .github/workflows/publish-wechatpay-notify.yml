name: Publish dwy-wechatpay-notify to PyPI

on:
  push:
    tags:
      - 'dwy-wechatpay-notify@*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'

      - name: Verify repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/private_release.py check

      - name: Verify license and tag match package metadata
        working-directory: backend/packages/wechatpay-notify
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if not project.get("license"):
              raise SystemExit("Package owner must confirm and declare the license before publishing")
          expected = f"{project['name']}@{project['version']}"
          if os.environ["GITHUB_REF_NAME"] != expected:
              raise SystemExit(f"Tag does not match package metadata: expected {expected}")
          PY

      - name: Install build dependencies
        run: python -m pip install uv==0.13.0

      - name: Test
        run: |
          uv sync --project ci --frozen
          uv run --project ci --frozen pytest -c backend/packages/wechatpay-notify/pyproject.toml backend/packages/wechatpay-notify/tests -q
          uv run --project ci --frozen ruff check --config backend/packages/wechatpay-notify/pyproject.toml backend/packages/wechatpay-notify/src backend/packages/wechatpay-notify/tests

      - name: Build
        working-directory: backend/packages/wechatpay-notify
        run: uv build --out-dir dist --default-index https://pypi.org/simple

      - name: Verify installable distributions
        run: >-
          python scripts/check_python_distribution.py backend/packages/wechatpay-notify
          --module dwy_wechatpay_notify --extras fastapi
          --import-module dwy_wechatpay_notify.fastapi

      - name: Verify installed core wheel
        run: |
          uv venv "$RUNNER_TEMP/wechatpay-notify-smoke"
          WHEEL=$(python -c 'from pathlib import Path; print(next(Path("backend/packages/wechatpay-notify/dist").glob("*.whl")).resolve())')
          uv pip install --python "$RUNNER_TEMP/wechatpay-notify-smoke/bin/python" --default-index https://pypi.org/simple "$WHEEL"
          "$RUNNER_TEMP/wechatpay-notify-smoke/bin/python" backend/packages/wechatpay-notify/tests/wheel_smoke.py

      - name: Stage universal wheel only
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          wheels = list(Path("backend/packages/wechatpay-notify/dist").glob("*.whl"))
          assert len(wheels) == 1 and wheels[0].name.endswith("-py3-none-any.whl")
          target = Path(os.environ["RUNNER_TEMP"]) / "dwy-wechatpay-notify-wheel"
          target.mkdir()
          shutil.copy2(wheels[0], target / wheels[0].name)
          PY

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: ${{ runner.temp }}/dwy-wechatpay-notify-wheel/
