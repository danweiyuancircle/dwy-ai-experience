name: Shared package CI and GitHub snapshot

on:
  push:
    branches: [master, 'codex/private-shared-*']
    tags: ['0.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    # 同一作业直接上传实际构建的字节，避开账号 Actions 中转产物配额。
    needs: [apple, device]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Node 22 的 test runner 会误读中文 stdout；24.22.1 已含上游 #64706 修复。
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify repository access and public package policy
        run: |
          python scripts/private_release.py check
          python -m unittest discover -s scripts/tests -p test_private_release.py
      - name: Install fixed build tools and locked dependencies
        run: |
          npm install --global pnpm@10.19.0
          python -m pip install uv==0.13.0
          pnpm install --frozen-lockfile
          uv sync --project ci --frozen
      - name: Python contracts and package tests
        run: |
          uv run --project ci --frozen pytest backend/tests backend/packages/auth/tests backend/packages/notify/tests backend/packages/webhooks/tests scripts/tests -q -o asyncio_mode=auto
          uv run --project ci --frozen pytest -c backend/packages/device-fingerprint/pyproject.toml backend/packages/device-fingerprint/tests -q
          uv run --project ci --frozen ruff check backend/src/dwyeapi/identity.py backend/packages/auth/src scripts/private_release.py
          uv run --project ci --frozen ruff check backend/src/dwyeapi/device.py backend/packages/device-fingerprint/src backend/packages/device-fingerprint/tests
          uv run --project ci --frozen ruff check --config backend/packages/webhooks/pyproject.toml backend/packages/webhooks/src backend/packages/webhooks/tests
          uv run --project ci --frozen ruff check --config backend/packages/notify/pyproject.toml backend/packages/notify/src backend/packages/notify/tests
      - name: Web and CLI regression
        run: |
          pnpm --dir frontend/eui build
          pnpm --dir frontend/ekit build
          pnpm --dir frontend/admin-shell build
          pnpm --dir frontend/eui test
          pnpm --dir frontend/ekit test
          pnpm --dir frontend/admin-shell test
          pnpm --dir frontend/auth-web test
          pnpm --dir dwy-cli test
      - name: Build and pack release artifacts
        run: |
          mkdir -p private-dist
          pnpm --dir frontend/auth-web build
          pnpm --dir frontend/eui pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          pnpm --dir frontend/ekit pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          pnpm --dir frontend/admin-shell pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          pnpm --dir frontend/auth-web pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          pnpm --dir dwy-cli pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend --out-dir "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend/packages/device-fingerprint --out-dir "$GITHUB_WORKSPACE/private-dist" --default-index https://pypi.org/simple
          uv build --project backend/packages/auth --out-dir "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend/packages/notify --out-dir "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend/packages/webhooks --out-dir "$GITHUB_WORKSPACE/private-dist"
          # uv 自动生成的目录忽略标记不是发布产物；其余非白名单文件仍需拒绝。
          rm -f private-dist/.gitignore
          python3 scripts/private_release.py manifest --directory private-dist --tag "0.0.0-ci.$GITHUB_RUN_ID" --revision "$GITHUB_SHA"
      - name: Verify and publish immutable release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/private_release.py check
          python3 scripts/private_release.py manifest --directory private-dist --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION"
          gh release create "$RELEASE_TAG" private-dist/* --verify-tag --title "Shared $RELEASE_TAG" --notes "Apple framework and EAPI authentication packages. Verify release-manifest.json and SHA256SUMS before installation."
      - name: Download the published release and verify bytes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/private_release.py download --tag "$RELEASE_TAG" --directory /tmp/published-private-packages

  device:
    uses: ./.github/workflows/device-fingerprint.yml

  apple:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      # 锁定的 Puppy 0.10.0 需要 Swift 6.2；runner 默认 Xcode 16.4 仍为 Swift 6.1。
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify repository access and Swift package
        run: |
          python3 scripts/private_release.py check
          swift package dump-package > /tmp/ios-package.json
          python3 -m unittest discover -s ios/Tests -p 'test_*.py'
          swift test
      - name: Build all products against real iOS simulator SDK
        run: |
          ios_sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build --triple arm64-apple-ios17.0-simulator --sdk "$ios_sdk_path" --scratch-path .build-ios
