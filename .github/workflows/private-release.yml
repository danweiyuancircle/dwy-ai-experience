name: Shared package CI and GitHub snapshot

on:
  push:
    branches: [master, 'codex/private-shared-*']
    tags: ['0.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    # 同一作业直接上传实际构建的字节，避开账号 Actions 中转产物配额。
    needs: [apple, device]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Node 22 的 test runner 会误读中文 stdout；24.22.1 已含上游 #64706 修复。
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Verify repository access and public package policy
        run: |
          python scripts/private_release.py check
          python -m unittest discover -s scripts/tests -p test_private_release.py
      - name: Install fixed build tools and locked dependencies
        run: |
          npm install --global pnpm@10.19.0
          python -m pip install uv==0.13.0
          pnpm install --frozen-lockfile
          uv sync --project ci --frozen
      - name: Python contracts and package tests
        run: |
          uv run --project ci --frozen pytest backend/tests backend/packages/auth/tests backend/packages/notify/tests scripts/tests -q -o asyncio_mode=auto
          uv run --project ci --frozen pytest -c backend/packages/apple-notify/pyproject.toml backend/packages/apple-notify/tests -q
          uv run --project ci --frozen pytest -c backend/packages/email-notify/pyproject.toml backend/packages/email-notify/tests -q
          uv run --project ci --frozen pytest -c backend/packages/payment/pyproject.toml backend/packages/payment/tests -q
          uv run --project ci --frozen pytest -c backend/packages/device-fingerprint/pyproject.toml backend/packages/device-fingerprint/tests -q
          uv run --project ci --frozen ruff check backend/src/dwyeapi/identity.py backend/packages/auth/src scripts/private_release.py
          uv run --project ci --frozen ruff check backend/src/dwyeapi/device.py backend/packages/device-fingerprint/src backend/packages/device-fingerprint/tests
          uv run --project ci --frozen ruff check --config backend/packages/apple-notify/pyproject.toml backend/packages/apple-notify/src backend/packages/apple-notify/tests
          uv run --project ci --frozen ruff check --config backend/packages/email-notify/pyproject.toml backend/packages/email-notify/src backend/packages/email-notify/tests
          uv run --project ci --frozen ruff check --config backend/packages/notify/pyproject.toml backend/packages/notify/src backend/packages/notify/tests
          uv run --project ci --frozen ruff check --config backend/packages/payment/pyproject.toml backend/packages/payment/src backend/packages/payment/tests
      - name: Web and CLI regression
        run: |
          pnpm --dir frontend/eui build
          pnpm --dir frontend/ekit build
          pnpm --dir frontend/admin-shell build
          pnpm --dir frontend/eui test
          pnpm --dir frontend/ekit test
          pnpm --dir frontend/admin-shell test
          pnpm --dir frontend/auth-web test
          pnpm --dir dwy-cli test
      - name: Build and pack release artifacts
        run: |
          mkdir -p private-dist
          pnpm --dir frontend/auth-web build
          pnpm --dir frontend/eui pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          pnpm --dir frontend/ekit pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          pnpm --dir frontend/admin-shell pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          pnpm --dir frontend/auth-web pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          pnpm --dir dwy-cli pack --pack-destination "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend --out-dir "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend/packages/device-fingerprint --out-dir "$GITHUB_WORKSPACE/private-dist" --default-index https://pypi.org/simple
          uv build --project backend/packages/auth --out-dir "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend/packages/notify --out-dir "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend/packages/apple-notify --out-dir "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend/packages/email-notify --out-dir "$GITHUB_WORKSPACE/private-dist"
          uv build --project backend/packages/payment --out-dir "$GITHUB_WORKSPACE/private-dist"
          # uv 自动生成的目录忽略标记不是发布产物；其余非白名单文件仍需拒绝。
          rm -f private-dist/.gitignore
          python3 scripts/private_release.py manifest --directory private-dist --tag "0.0.0-ci.$GITHUB_RUN_ID" --revision "$GITHUB_SHA"
      - name: Verify and publish immutable release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/private_release.py check
          python3 scripts/private_release.py manifest --directory private-dist --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION"
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" private-dist/* --verify-tag "${release_flags[@]}" --title "Shared $RELEASE_TAG" --notes "Apple framework and EAPI package snapshots. See apple/CHANGELOG.md at this tag for compatibility, validation and known limitations. SwiftPM consumers use the semantic Git tag. Verify release-manifest.json and SHA256SUMS before installing snapshot artifacts."
      - name: Download the published release and verify bytes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/private_release.py download --tag "$RELEASE_TAG" --directory /tmp/published-private-packages

  device:
    uses: ./.github/workflows/device-fingerprint.yml

  apple:
    name: Apple (macOS ${{ matrix.macos }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: '26'
            runner: macos-26
            developer-dir: /Applications/Xcode_26.0.1.app/Contents/Developer
          # GitHub 的 macOS 27 ARM64 公开预览镜像使用 xcode-27 标签。
          - macos: '27'
            runner: xcode-27
            developer-dir: /Applications/Xcode_27.2.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      # 分别固定工具链；包的最低系统仍为 macOS 26 Apple Silicon。
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
      APPLE_TEMPLATE_TOOL_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Report Apple runner and toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Prepare verified XcodeGen for template regression
        run: |
          xcodegen_dir="$RUNNER_TEMP/xcodegen-2.46.0"
          mkdir -p "$xcodegen_dir"
          gh release download 2.46.0 --repo yonaskolb/XcodeGen --pattern xcodegen.zip --dir "$xcodegen_dir"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $xcodegen_dir/xcodegen.zip" | shasum -a 256 --check
          ditto -xk "$xcodegen_dir/xcodegen.zip" "$xcodegen_dir"
          echo "$xcodegen_dir/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Verify repository access and Swift package
        run: |
          xcodegen --version
          python3 scripts/private_release.py check
          swift package dump-package > /tmp/ios-package.json
          python3 -m unittest discover -s apple/Tests -p 'test_*.py'
          swift test
      - name: Build Apple package for Apple Silicon
        run: |
          swift build --triple arm64-apple-macosx26.0
      - name: Build all products against real iOS simulator SDK
        run: |
          ios_sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          # 清单在 macOS 宿主求值时包含 Mac 展示程序；只编译 iOS 公开库及其依赖。
          for target in SyncCore CoreKit LogKit L10nKit CacheKit DesignCore DesignKitIOS PurchaseCore AuthCore AuthUI AuthGoogleIOS AuthAppleIOS PermissionCore PermissionIOS PermissionUI PermissionCameraIOS PermissionPhotoLibraryIOS PermissionMicrophoneIOS PermissionContactsIOS PermissionSpeechIOS PermissionMotionIOS PermissionMediaLibraryIOS PermissionBluetoothIOS PermissionTrackingIOS PermissionSiriIOS PermissionNotificationIOS PermissionCalendarIOS PermissionRemindersIOS PermissionHealthIOS PermissionFaceIDIOS PermissionLocationIOS; do
            swift build --target "$target" --triple arm64-apple-ios18.0-simulator --sdk "$ios_sdk_path" --scratch-path .build-ios
          done
