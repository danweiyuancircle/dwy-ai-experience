# =============================================================================
# 四层目录（与 TVRemote 一致）
#
#   App/              ① APP 层
#   Features/         ② Features 层
#   BizFoundation/    ③ 业务基础层（package）
#   Foundation/       ④ 业务无关基础层（层锚点；kits 来自统一私有包版本）
#
# 部署底线：iOS 17.0+
# 规约：Docs/ARCHITECTURE.md
# =============================================================================
name: __APP_NAME__
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  # ③
  BizFoundation:
    path: .
  AppleAppKit:
    url: __PACKAGE_URL__
    from: __PACKAGE_VERSION__
targets:
  __APP_NAME__:
    type: application
    platform: iOS
    # ① + ② + 资源（根目录并列，不再套一层 AppName/）
    sources:
      # 排除各层 README，避免多份 README.md 打进 Resources 冲突
      - path: App
        excludes:
          - "**/*.md"
          - "*.storekit"
      - path: Features
        excludes:
          - "**/*.md"
      - path: Resources
    dependencies:
      - package: BizFoundation
      - package: AppleAppKit
        product: CoreKit
      - package: AppleAppKit
        product: L10nKit
      - package: AppleAppKit
        product: DesignCore
      - package: AppleAppKit
        product: DesignKitIOS
      - package: AppleAppKit
        product: LogKit
      - package: AppleAppKit
        product: CacheKit
      - package: AppleAppKit
        product: PurchaseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        PRODUCT_NAME: __APP_NAME__
        PRODUCT_MODULE_NAME: __APP_NAME__
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGNING_ALLOWED: "YES"
        DEVELOPMENT_TEAM: "__TEAM_ID__"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: __APP_NAME__
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: __APP_NAME__
        CFBundleName: __APP_NAME__
        CFBundleLocalizations:
          - zh-Hans
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
  __APP_NAME__Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - __APP_NAME__Tests
    dependencies:
      - target: __APP_NAME__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: "__TEAM_ID__"
        CODE_SIGN_STYLE: Automatic
schemes:
  __APP_NAME__:
    build:
      targets:
        __APP_NAME__: all
        __APP_NAME__Tests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Products.storekit
    test:
      config: Debug
      targets:
        - __APP_NAME__Tests
    archive:
      config: Release
