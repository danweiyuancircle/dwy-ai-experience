[project]
name = "dwy-shared"
version = "0.1.0"
description = "跨项目通用 kernel(业务无关基础设施)"
requires-python = ">=3.11"
# 依赖仅声明包名,版本号由根 pyproject.toml 统一管理
dependencies = [
    "dwyeapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwy_shared"]
