name: EmailPasswordAuthExample
options:
  bundleIdPrefix: com.dwy
  deploymentTarget:
    iOS: "17.0"
packages:
  AppleAppKit:
    path: ../../..
targets:
  EmailPasswordAuthExample:
    type: application
    platform: iOS
    sources:
      - path: EmailPasswordAuthApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwy.auth-example
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    dependencies:
      - package: AppleAppKit
        product: AuthCore
      - package: AppleAppKit
        product: AuthUI
  EmailPasswordAuthExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EmailPasswordAuthExample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  EmailPasswordAuthExample:
    build:
      targets:
        EmailPasswordAuthExample: all
    test:
      targets:
        - EmailPasswordAuthExampleUITests
