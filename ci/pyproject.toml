[project]
name = "dwy-shared-ci"
version = "0.0.0"
requires-python = ">=3.11,<3.13"
dependencies = ["dwyeapi[dev,device]==0.12.2", "dwy-auth[dev]==0.2.0", "dwy-notify[dev,sqlalchemy]==0.3.3", "dwy-wechatpay-notify[fastapi]==0.1.1", "dwy-apple-notify[iap,asc,reviews,analytics,ratings,dev]==0.1.10", "dwy-email-notify[resend,dev]==0.1.2", "dwy-payment[dev,alipay]==0.3.0"]

[tool.uv]
package = false
# CI 源码兼容矩阵使用新通知内核；不修改其他已发布来源包的运行时固定依赖。
override-dependencies = ["dwy-notify==0.3.3", "dwyeapi[dev,device]==0.12.2"]
# 固定发布时间上界，避免重建锁文件时引入发布不足七天的新依赖。
exclude-newer = "2026-10-13T00:00:00Z"
# 通知能力已确认使用 2026-10-24 发布的 Apprise 2.1.0，其余依赖继续冻结。
exclude-newer-package = { apprise = "2026-10-25T00:00:00Z" }

[tool.uv.sources]
dwyeapi = { path = "../backend", editable = true }
dwy-device-fingerprint = { path = "../backend/packages/device-fingerprint", editable = true }
dwy-auth = { path = "../backend/packages/auth", editable = true }
dwy-notify = { path = "../backend/packages/notify", editable = true }
dwy-wechatpay-notify = { path = "../backend/packages/wechatpay-notify", editable = true }
dwy-apple-notify = { path = "../backend/packages/apple-notify", editable = true }
dwy-email-notify = { path = "../backend/packages/email-notify", editable = true }
dwy-payment = { path = "../backend/packages/payment", editable = true }
