[project]
name = "dwy-shared-ci"
version = "0.0.0"
requires-python = ">=3.11,<3.13"
dependencies = ["dwyeapi[dev,device]==0.12.1", "dwy-auth[dev]==0.1.1", "dwy-webhooks[discord,resend,apple,reviews,analytics,dev]==0.5.1"]

[tool.uv]
package = false
# 固定发布时间上界，避免重建锁文件时引入发布不足七天的新依赖。
exclude-newer = "2026-10-13T00:00:00Z"

[tool.uv.sources]
dwyeapi = { path = "../backend", editable = true }
dwy-device-fingerprint = { path = "../backend/packages/device-fingerprint", editable = true }
dwy-auth = { path = "../backend/packages/auth", editable = true }
dwy-webhooks = { path = "../backend/packages/webhooks", editable = true }
